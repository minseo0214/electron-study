<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가계부 (Household Account Book)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>💰 가계부 (Household Account Book)</h1>
      <div class="header-buttons">
        <button id="importBtn" class="btn btn-secondary">📥 Import</button>
        <button id="exportBtn" class="btn btn-secondary">📤 Export</button>
      </div>
    </header>

    <main>
      <section class="input-section">
        <h2>Add Transaction</h2>
        <form id="transactionForm">
          <div class="form-row">
            <div class="form-group">
              <label for="date">Date:</label>
              <input type="date" id="date" required>
            </div>
            <div class="form-group">
              <label for="type">Type:</label>
              <select id="type" required>
                <option value="income">Income (수입)</option>
                <option value="expense">Expense (지출)</option>
              </select>
            </div>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label for="category">Category:</label>
              <input type="text" id="category" placeholder="e.g., Food, Salary" required>
            </div>
            <div class="form-group">
              <label for="amount">Amount (₩):</label>
              <input type="number" id="amount" placeholder="0" required min="0">
            </div>
          </div>

          <div class="form-group">
            <label for="description">Description:</label>
            <input type="text" id="description" placeholder="Optional description">
          </div>

          <button type="submit" class="btn btn-primary">Add Transaction</button>
        </form>
      </section>

      <section class="summary-section">
        <h2>Summary</h2>
        <div class="summary-cards">
          <div class="summary-card income">
            <h3>Total Income</h3>
            <p class="amount" id="totalIncome">₩0</p>
          </div>
          <div class="summary-card expense">
            <h3>Total Expense</h3>
            <p class="amount" id="totalExpense">₩0</p>
          </div>
          <div class="summary-card balance">
            <h3>Balance</h3>
            <p class="amount" id="balance">₩0</p>
          </div>
        </div>
      </section>

      <section class="transactions-section">
        <h2>Transactions</h2>
        <div class="filter-section">
          <input type="text" id="searchInput" placeholder="Search by category or description...">
          <select id="filterType">
            <option value="all">All</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </div>
        <div id="transactionsList"></div>
      </section>
    </main>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
